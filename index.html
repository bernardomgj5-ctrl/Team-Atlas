<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Team Atlas — Pokémon Champions</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<style>:root{--bg:#e8ecf0;--panel:#ffffff;--ink:#16202c;--muted:#5a6777;--line:#d2d9e1;--soft:#f3f5f8;--ac:#0f8a9c;--good:#1f8a4c;--bad:#c23a2e;--neu:#7a6a2a;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10161e;--panel:#18212c;--ink:#e6ecf2;--muted:#95a3b3;--line:#283444;--soft:#1f2a37;--good:#4cc27d;--bad:#ef6a5c;--neu:#d8c06a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10161e;--panel:#18212c;--ink:#e6ecf2;--muted:#95a3b3;--line:#283444;--soft:#1f2a37;--good:#4cc27d;--bad:#ef6a5c;--neu:#d8c06a;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.45 "Barlow",system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:inherit}
h1,h2,h3,h4,.tchip b,.t-mono,.val,.big b,.vs,.plus{font-family:"Barlow Condensed","Arial Narrow",system-ui,sans-serif}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 12px 8px}
.brand{display:flex;align-items:baseline;gap:8px;margin:0 0 8px;font:700 22px/1 "Barlow Condensed",sans-serif;letter-spacing:.2px}
.brand small{font:500 13px "Barlow",sans-serif;color:var(--muted)}
#teams{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
#teams::-webkit-scrollbar{display:none}
.tchip{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-start;gap:1px;border:2px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:5px 10px 6px;cursor:pointer;max-width:170px;text-align:left}
.tchip b{font-size:18px;line-height:1;color:var(--ac)}
.tchip span{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.tchip.on{border-color:var(--ac);box-shadow:inset 0 -4px 0 var(--ac)}
main{max-width:980px;margin:0 auto;padding:14px 12px 96px}
.h{font-size:30px;margin:4px 0 10px;line-height:1}.h span{color:var(--ac)}
.h2{font-size:22px;margin:22px 0 8px}
.muted{color:var(--muted);font-size:14px}
.empty{background:var(--panel);border:1px dashed var(--line);border-radius:12px;padding:16px;color:var(--muted)}
/* ---- cartão visual ---- */
.tile{position:relative;display:grid;place-items:center;flex:0 0 auto;border-radius:14px;text-decoration:none;color:#fff;
 background:linear-gradient(135deg,var(--c1) 0 50%,var(--c2) 50% 100%);box-shadow:inset 0 0 0 2px rgba(255,255,255,.28),0 1px 0 rgba(0,0,0,.08);overflow:hidden}
.tile:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.tile.lg{width:128px;height:128px;border-radius:18px}.tile.md{width:84px;height:84px}.tile.sm{width:46px;height:46px;border-radius:10px}
.t-img{position:absolute;inset:6%;width:88%;height:88%;object-fit:contain;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35));pointer-events:none}
.sm .t-img{inset:4%;width:92%;height:92%}
.has-img .t-mono{display:none}
.t-mono{font-weight:800;letter-spacing:1px;text-shadow:0 2px 0 rgba(0,0,0,.35),0 0 12px rgba(0,0,0,.25);line-height:1}
.lg .t-mono{font-size:54px;margin-top:-14px}.md .t-mono{font-size:34px;margin-top:-10px}.sm .t-mono{font-size:19px}
.t-role{position:absolute;top:5px;right:5px;width:28px;height:28px;display:grid;place-items:center;border-radius:50%;background:rgba(255,255,255,.92);font-size:15px;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.md .t-role{width:24px;height:24px;font-size:13px;top:4px;right:4px}
.sm .t-role{width:17px;height:17px;font-size:9.5px;top:2px;right:2px}
.t-flag{position:absolute;top:5px;left:6px;font:800 12px/1 "Barlow Condensed",sans-serif;background:rgba(0,0,0,.45);padding:3px 5px;border-radius:5px}
.sm .t-flag{font-size:9px;padding:2px 3px;top:2px;left:2px}
.t-cta{position:absolute;left:0;right:0;bottom:0;padding:5px 0 6px;text-align:center;font:700 11px/1 "Barlow",sans-serif;letter-spacing:.6px;background:rgba(0,0,0,.5)}
.md .t-cta{font-size:9px;padding:4px 0}
.t-cta.sm{left:auto;right:2px;bottom:2px;width:14px;height:14px;padding:0;display:grid;place-items:center;border-radius:4px;font-size:10px}
.pk{display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;min-width:0}
.pk-name{font-weight:700;font-size:13.5px;line-height:1.15;max-width:110px}
.pk.sm .pk-name{font-size:12px;max-width:72px}
.role-line,.pk-sub{font-size:12px;color:var(--muted);line-height:1.2}
.type{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--tc);color:#fff;margin:0 4px 4px 0;text-shadow:0 1px 0 rgba(0,0,0,.25)}
/* ---- times ---- */
.hero{background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--ac);border-radius:14px;padding:14px 14px 10px;margin-bottom:14px}
.hero h1{font-size:34px;margin:0 0 6px;line-height:1;color:var(--ac)}.hero h1 span{color:var(--ink)}
.plan{margin:0 0 10px;max-width:70ch}
.wins{display:grid;gap:6px}.win{display:flex;gap:8px;align-items:flex-start;font-size:14.5px}.win b{flex:0 0 22px;text-align:center}
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.mon{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;display:grid;grid-template-columns:128px 1fr;grid-template-rows:auto auto auto 1fr;column-gap:12px;align-items:start}
.mon .tile{grid-row:1/5}
.mon h2{margin:0;font-size:25px;line-height:1.05}
.fn{font-size:13.5px;margin:3px 0 6px;line-height:1.25}.types{margin-bottom:2px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:0;font-size:14px}.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:600}
.more{grid-column:1/-1;margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
.more summary,.legend summary,.form summary{cursor:pointer;font-weight:600;color:var(--ac);font-size:14px}
.moves{display:grid;grid-template-columns:1fr 1fr;gap:4px;list-style:none;padding:0;margin:8px 0 0}.moves li{background:var(--soft);border-radius:8px;padding:5px 8px;font-size:13.5px;font-weight:600}
.rules{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:14px}.rules h3{margin:0 0 6px;font-size:21px}.rules ul{margin:0;padding-left:20px}.rules li{margin:3px 0}
.legend{margin-top:14px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.lg-grid{display:flex;flex-wrap:wrap;gap:6px 16px;margin:8px 0 4px;font-size:14px}
.flagdemo{background:#555;color:#fff;border-radius:4px;padding:0 4px;font-size:12px}
.credit{font-size:12.5px;color:var(--muted);margin-top:18px}
/* ---- segmentos ---- */
.seg{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.seg button{border:1.5px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:6px 12px;font:600 13.5px "Barlow",sans-serif;cursor:pointer}
.seg button.on{background:var(--ac);border-color:var(--ac);color:#fff}
button:focus-visible,summary:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
/* ---- leads ---- */
.leads{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.lead{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.tag{font-size:12px;font-weight:700;padding:3px 8px;border-radius:6px;background:var(--soft)}
.tag.rec{background:#f6d860;color:#3a2e00}.tag.fast{background:#cfe0ff;color:#12305e}.tag.gen{background:var(--soft)}.tag.sit{background:#ead7f5;color:#3d1557}
.duo{display:flex;align-items:flex-start;justify-content:center;gap:10px}
.plus{font-size:34px;line-height:84px;color:var(--muted)}
.when{margin-top:10px;font-size:14px}.when b,.gp b{display:block;font-size:12px;color:var(--muted);font-weight:700}
.arrow{text-align:center;color:var(--ac);font-weight:800;font-size:20px;line-height:1;margin:4px 0}
.gp{background:var(--soft);border-left:4px solid var(--ac);border-radius:8px;padding:8px 10px;font-size:14.5px}
.back{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
.bh{display:block;font-size:12px;color:var(--muted);font-weight:700;margin:2px 0 4px}
.brow,.arow{display:flex;gap:10px;align-items:flex-start;margin:6px 0}.brow p,.arow p{margin:0;font-size:13.5px;line-height:1.4}
.brow .pk{flex:0 0 76px}.alts{margin-top:8px}.ev{font-size:12px;color:var(--muted);margin:8px 0 0}
/* ---- matchups ---- */
.mlist{display:grid;gap:10px}
.mu{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.mu>summary{cursor:pointer;list-style:none}.mu>summary::-webkit-details-marker{display:none}
.mu-head{display:flex;align-items:center;gap:10px}.mu-opp{display:flex;gap:4px;flex:0 0 auto}
.mu-t{display:flex;flex-direction:column;gap:2px;min-width:0}.mu-t b{font-size:16px}
.diff{font-size:12px;font-weight:700;align-self:flex-start;padding:1px 8px;border-radius:999px;border:1.5px solid currentColor}
.diff.g{color:var(--good)}.diff.r{color:var(--bad)}.diff.n{color:var(--neu)}
.versus{display:grid;grid-template-columns:1fr;gap:6px;margin:14px 0 6px}
@media (min-width:640px){.versus{grid-template-columns:1fr auto 1fr;align-items:center}}
.side .lab{font-size:12px;font-weight:700;color:var(--muted);text-align:center;margin-bottom:6px}
.vs{font-size:26px;font-weight:800;color:var(--ac);text-align:center;line-height:1}
.opprow{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.blk{margin-top:12px}.blk h4{margin:0 0 6px;font-size:18px}
.blk .row{display:grid;grid-template-columns:78px 1fr;gap:10px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.blk .row p{margin:0;font-size:14.5px}
.warn h4{color:var(--bad)}.ok h4{color:var(--good)}
.four{display:flex;gap:10px;flex-wrap:wrap}
.rule{margin-top:12px;background:var(--soft);border-radius:8px;padding:8px 10px;font-size:14px}
/* ---- speed ---- */
.spd{list-style:none;padding:0;margin:0;display:grid;gap:4px}
.spd li{display:grid;grid-template-columns:46px minmax(0,1fr) minmax(44px,22%) 40px;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:5px 8px}
.spd li.bench{background:transparent;border-style:dashed}
.sp-n{display:flex;flex-direction:column;min-width:0}.sp-n b{font-size:14px;line-height:1.2}
.tm{font-size:11.5px;font-weight:700;color:var(--ac)}.bm{font-size:11.5px;color:var(--muted)}
.bar{height:10px;background:var(--soft);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.bench .bar i{background:var(--muted)}
.val{font-size:20px;text-align:right}
/* ---- partidas ---- */
.teamstats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.ts{position:relative;overflow:hidden;border:2px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:6px 8px 10px;text-align:left;cursor:pointer}
.ts b{display:block;font:700 18px "Barlow Condensed",sans-serif;color:var(--ac)}.ts span{font-size:12.5px}
.ts i{position:absolute;left:0;bottom:0;height:4px;background:var(--good)}.ts.on{border-color:var(--ac)}
.big{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.big div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.big b{display:block;font-size:34px;line-height:1}.big span{font-size:12.5px;color:var(--muted)}
.opps{list-style:none;padding:0;margin:0;display:grid;gap:4px}
.orow{display:grid;grid-template-columns:46px minmax(0,1fr) minmax(40px,20%) 40px auto;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:5px 8px}
.o-n{display:flex;flex-direction:column;min-width:0}.o-n b{font-size:14px}.o-n span{font-size:12px;color:var(--muted)}
.bar.wl{background:color-mix(in srgb,var(--bad) 35%,transparent)}.bar.wl i{background:var(--good)}
.lnk{border:1.5px solid var(--line);background:var(--soft);color:var(--ink);border-radius:8px;padding:5px 9px;font:600 12.5px "Barlow",sans-serif;cursor:pointer}
.orow .glist{grid-column:1/-1}
.glist{list-style:none;padding:0;margin:6px 0 0;display:grid;gap:6px}
.gm{display:grid;grid-template-columns:30px 1fr;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px}
.res{display:grid;place-items:center;width:30px;height:30px;border-radius:8px;font:800 16px "Barlow Condensed",sans-serif;color:#fff}.res.v{background:var(--good)}.res.d{background:var(--bad)}
.mini{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}.mini .tile.sm{width:34px;height:34px;border-radius:8px}.mini .t-mono{font-size:14px}.mini .t-cta.sm,.mini .t-flag{display:none}
.form{margin-top:18px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.form form{display:grid;gap:10px;margin-top:10px}.form label{display:grid;gap:3px;font-size:13.5px;font-weight:600}
.form input,.form select{font:15px "Barlow",sans-serif;padding:8px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%}
.rs{border:1.5px solid var(--line);border-radius:8px;display:flex;flex-wrap:wrap;gap:12px}.rs label{display:flex;gap:6px;align-items:center;font-weight:500}.rs input{width:auto}
.save{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:10px;font:700 15px "Barlow",sans-serif;cursor:pointer}
/* ---- abas ---- */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:grid;grid-template-columns:repeat(5,1fr);background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
#tabs button{border:0;background:none;color:var(--muted);padding:8px 0 9px;font:600 12.5px "Barlow",sans-serif;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer}
#tabs button span{font-size:19px;line-height:1.1}
#tabs button.on{color:var(--ac);box-shadow:inset 0 3px 0 var(--ac)}
@media (min-width:760px){.teamstats{grid-template-columns:repeat(6,1fr)}}
@media (max-width:380px){.mon{grid-template-columns:104px 1fr}.tile.lg{width:104px;height:104px}.lg .t-mono{font-size:44px}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<header class="top"><p class="brand">Team Atlas <small>Pokémon Champions · Reg M-C</small></p><nav id="teams" aria-label="Escolher time"></nav></header>
<main id="view"></main>
<nav id="tabs" aria-label="Seções">
<button data-tab="times"><span>👥</span>Times</button>
<button data-tab="leads"><span>🚀</span>Leads</button>
<button data-tab="matchups"><span>⚔️</span>Matchups</button>
<button data-tab="speed"><span>⏱️</span>Speed</button>
<button data-tab="partidas"><span>📊</span>Partidas</button>
</nav>
<script>
/* ===== DADOS DO ATLAS ===== */
const ROLES = {
  wc:{i:"💥",n:"Win condition"}, of:{i:"⚔️",n:"Ofensivo"}, de:{i:"🛡️",n:"Defensivo"},
  sc:{i:"⚡",n:"Speed control"}, su:{i:"🎯",n:"Suporte"}, pv:{i:"🔄",n:"Pivô"}, co:{i:"🧱",n:"Controle de campo"}
};
const TYPE_COLOR = {
  "Normal":"#9a9684","Fogo":"#e0612c","Água":"#3a7fd6","Grama":"#48a046","Elétrico":"#e0ad17","Gelo":"#4fbdcc",
  "Lutador":"#c0392b","Venenoso":"#9446b5","Terra":"#b5854a","Voador":"#7f9be3","Psíquico":"#e04f78","Inseto":"#8aa326",
  "Pedra":"#a08a4c","Fantasma":"#65559c","Dragão":"#5647cf","Sombrio":"#574840","Aço":"#7a8fa3","Fada":"#de86c3"
};
/* Espécies: nome, tipos, monograma, papel, slug do Pokémon Database, mega */
const SP = {
  "gallade":{n:"Gallade",t:["Psíquico","Lutador"],m:"GL",r:"wc",s:"gallade"},
  "mega-gallade":{n:"Mega Gallade",t:["Psíquico","Lutador"],m:"GL",r:"wc",s:"gallade",mega:1},
  "staraptor-mega":{n:"Mega Staraptor",t:["Lutador","Voador"],m:"SR",r:"sc",s:"staraptor",mega:1},
  "mawile-mega":{n:"Mega Mawile",t:["Aço","Fada"],m:"MW",r:"of",s:"mawile",mega:1},
  "farigiraf":{n:"Farigiraf",t:["Normal","Psíquico"],m:"FG",r:"sc",s:"farigiraf"},
  "lycanroc-dusk":{n:"Lycanroc-Dusk",t:["Pedra"],m:"LY",r:"of",s:"lycanroc"},
  "milotic":{n:"Milotic",t:["Água"],m:"MI",r:"de",s:"milotic"},
  "garchomp-mega":{n:"Mega Garchomp",t:["Dragão","Terra"],m:"GC",r:"wc",s:"garchomp",mega:1},
  "garchomp-mega-z":{n:"Garchomp-Mega-Z",t:["Dragão"],m:"GC",r:"wc",s:"garchomp",mega:1,z:1},
  "tyranitar":{n:"Tyranitar",t:["Pedra","Sombrio"],m:"TT",r:"co",s:"tyranitar"},
  "excadrill":{n:"Excadrill",t:["Terra","Aço"],m:"EX",r:"of",s:"excadrill"},
  "sinistcha":{n:"Sinistcha",t:["Grama","Fantasma"],m:"SI",r:"sc",s:"sinistcha"},
  "rotom-wash":{n:"Wash Rotom",t:["Elétrico","Água"],m:"RW",r:"pv",s:"rotom"},
  "rotom-heat":{n:"Rotom-Heat",t:["Elétrico","Fogo"],m:"RH",r:"pv",s:"rotom"},
  "maushold":{n:"Maushold",t:["Normal"],m:"MS",r:"su",s:"maushold"},
  "maushold-four":{n:"Maushold-Four",t:["Normal"],m:"MS",r:"su",s:"maushold"},
  "kingambit":{n:"Kingambit",t:["Sombrio","Aço"],m:"KB",r:"of",s:"kingambit"},
  "empoleon":{n:"Empoleon",t:["Água","Aço"],m:"EM",r:"de",s:"empoleon"},
  "raichu-mega-y":{n:"Mega Raichu-Y",t:["Elétrico"],m:"RY",r:"of",s:"raichu",mega:1},
  "weavile":{n:"Weavile",t:["Sombrio","Gelo"],m:"WV",r:"of",s:"weavile"},
  "grimmsnarl":{n:"Grimmsnarl",t:["Sombrio","Fada"],m:"GM",r:"su",s:"grimmsnarl"},
  "rillaboom":{n:"Rillaboom",t:["Grama"],m:"RB",r:"co",s:"rillaboom"},
  "talonflame":{n:"Talonflame",t:["Fogo","Voador"],m:"TF",r:"sc",s:"talonflame"},
  "torterra":{n:"Torterra",t:["Grama","Terra"],m:"TO",r:"co",s:"torterra"},
  "aegislash":{n:"Aegislash",t:["Aço","Fantasma"],m:"AE",r:"of",s:"aegislash"},
  "sylveon":{n:"Sylveon",t:["Fada"],m:"SY",r:"of",s:"sylveon"}
};
/* Adversários: chave → [nome, tipos, espécie-base (agrupa no histórico)] */
const OPP_RAW = {
  "charizard-mega-y":["Mega Charizard-Y",["Fogo","Voador"],"Charizard"],
  "raichu-mega-y":["Mega Raichu-Y",["Elétrico"],"Raichu"],
  "staraptor":["Staraptor",["Normal","Voador"],"Staraptor"],
  "staraptor-mega":["Mega Staraptor",["Lutador","Voador"],"Staraptor"],
  "garchomp":["Garchomp",["Dragão","Terra"],"Garchomp"],
  "garchomp-mega-z":["Garchomp-Mega-Z",["Dragão"],"Garchomp"],
  "kingambit":["Kingambit",["Sombrio","Aço"],"Kingambit"],
  "sneasler":["Sneasler",["Lutador","Venenoso"],"Sneasler"],
  "basculegion":["Basculegion",["Água","Fantasma"],"Basculegion"],

const SPRITE_ALIAS = {"indeedee-f":"indeedee-female","indeedee-m":"indeedee-male","maushold-four":"maushold-family-of-four","maushold-three":"maushold-family-of-three"};
const DEX_DEFAULT = (()=>{const o={};for(const [n,id] of Object.entries(DEX)){const p=n.split("-");for(let i=1;i<p.length;i++){const b=p.slice(0,i).join("-");if(!(b in o)||id<o[b])o[b]=id}}return o})();
function dexOne(n){if(!n)return 0;n=SPRITE_ALIAS[n]||n;if(DEX[n])return DEX[n];
  if(n.startsWith("mega-")){const r=n.slice(5)+"-mega";if(DEX[r])return DEX[r]}
  return DEX_DEFAULT[n]||0}
const SPRITE_CACHE={};
function spriteId(k,s){if(k in SPRITE_CACHE)return SPRITE_CACHE[k];
  let id=0;const v=SPRITES[k];
  if(v&&v.status==="VALIDADO"&&v.id)id=v.id;
  else{const p=String(k).toLowerCase().split("-");for(let i=p.length;i>0&&!id;i--)id=dexOne(p.slice(0,i).join("-"));
    if(!id&&s&&s.s)id=dexOne(String(s.s).toLowerCase())}
  return SPRITE_CACHE[k]=id}
const artUrl=id=>`https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${id}.png`;

/* ===== RENDER ===== */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ST={team:0,tab:"times",spdMode:"normal",spdScope:"team",pScope:"team",pOpen:null,games:[],db:null,dbState:"loading"};
try{const s=JSON.parse(localStorage.getItem("atlas-ui")||"{}");if(s.team!=null)ST.team=s.team;if(s.tab)ST.tab=s.tab;}catch(e){}
function saveUI(){try{localStorage.setItem("atlas-ui",JSON.stringify({team:ST.team,tab:ST.tab}))}catch(e){}}

function spec(k){return SP[k]?Object.assign({own:1},SP[k]):oppSpecies(k)}
function tcol(t){return TYPE_COLOR[t]||"#888"}
/* Cartão visual (identidade fixa do Pokémon). size: lg | md | sm */
function tile(k,size,opts={}){
  const s=spec(k);const c1=tcol(s.t[0]),c2=tcol(s.t[1]||s.t[0]);
  const role=(opts.role!==false && s.own && ROLES[s.r])?`<span class="t-role" title="${ROLES[s.r].n}">${ROLES[s.r].i}</span>`:"";
  const flag=s.z?`<span class="t-flag">Z</span>`:(s.mega?`<span class="t-flag">M</span>`:"");
  return `<div class="tile ${size}" style="--c1:${c1};--c2:${c2}" role="img" aria-label="${esc(s.n)}">${spriteImg(k,s)}${flag}${role}<span class="t-mono">${esc(s.m)}</span></div>`;
}
/* Imagem dentro do cartão: descobre o número pela spriteId() e tenta sprites/<id>.png do próprio site; se não existir, usa a arte da PokeAPI; se falhar, fica o monograma */
function spriteImg(k,s){const id=spriteId(k,s);if(!id)return"";
  return `<img class="t-img" src="sprites/${id}.png" data-alt="${artUrl(id)}" alt="" loading="lazy" decoding="async" onload="this.parentNode.classList.add('has-img')" onerror="if(this.dataset.alt){this.src=this.dataset.alt;this.dataset.alt=''}else{this.remove()}">`}
function spriteHref(k,s){const id=spriteId(k,s);return id?artUrl(id):"https://pokemondb.net/sprites/"+esc(s&&s.s)}
function typeChips(k){return spec(k).t.map(t=>`<span class="type" style="--tc:${tcol(t)}">${t}</span>`).join("")}
function roleLine(k){const s=spec(k);if(!s.own)return"";const r=ROLES[s.r];return `<span class="role-line">${r.i} ${r.n}</span>`}
/* Bloco compacto: cartão + nome + função */
function pk(k,size="md",sub,o={}){const s=spec(k);return `<div class="pk ${size}">${tile(k,size,o)}<div class="pk-name">${esc(s.n)}</div>${sub!==undefined?`<div class="pk-sub">${sub}</div>`:roleLine(k)}</div>`}

const TAGS={rec:["★","Recomendado"],fast:["⚡","Rápido"],gen:["◎","Genérico"],sit:["◆","Situacional"]};
const DIFF={fav:["Favorável","g"],lfav:["Levemente favorável","g"],eq:["Equilibrado","n"],ldes:["Levemente desfavorável","r"],des:["Desfavorável","r"]};
const credit=`<p class="credit">Sprites: <a href="https://github.com/PokeAPI/sprites" target="_blank" rel="noopener">PokeAPI/sprites</a> (arte oficial).</p>`;

function T(){return TEAMS[ST.team]}
function renderTeamBar(){
  $("#teams").innerHTML=TEAMS.map((t,i)=>`<button class="tchip ${i===ST.team?"on":""}" style="--ac:${t.accent}" data-team="${i}" aria-pressed="${i===ST.team}"><b>${t.id}</b><span>${esc(t.name)}</span></button>`).join("");
  document.documentElement.style.setProperty("--ac",T().accent);
}
function renderLegend(){return `<details class="legend"><summary>Legenda dos símbolos</summary><div class="lg-grid">${Object.values(ROLES).map(r=>`<span>${r.i} ${r.n}</span>`).join("")}<span><b class="flagdemo">M</b> Mega</span><span><b class="flagdemo">Z</b> Mega Z</span></div><p class="muted">A cor do cartão vem dos tipos (diagonal = tipo duplo). O símbolo de função fica sempre no canto superior direito.</p></details>`}

function vTimes(){const t=T();
 return `<section class="hero"><h1>${t.id} <span>${esc(t.name)}</span></h1><p class="plan">${esc(t.plan)}</p>
 <div class="wins">${t.wins.map((w,i)=>`<div class="win"><b>${i===0?"💥":i===1?"②":"③"}</b>${esc(w)}</div>`).join("")}</div></section>
 <div class="roster">${t.roster.map(r=>{const s=SP[r.k];return `<article class="mon">
   ${tile(r.k,"lg")}

    <ul class="moves">${r.mv.map(m=>`<li>${esc(m)}</li>`).join("")}</ul></details>
 </article>`}).join("")}</div>
 <section class="rules"><h3>🚫 Regras duras</h3><ul>${t.rules.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></section>
 ${renderLegend()}${credit}`;}

function vLeads(){const t=T();
 const order={rec:0,fast:1,gen:2,sit:3};const L=[...t.leads].sort((a,b)=>order[a.tags[0]]-order[b.tags[0]]);
 const filt=`<div class="seg" role="group" aria-label="Filtrar leads">${["all","rec","fast","gen","sit"].map(f=>`<button data-lf="${f}" class="${(ST.lf||"all")===f?"on":""}">${f==="all"?"Todos":TAGS[f][0]+" "+TAGS[f][1]}</button>`).join("")}</div>`;
 const show=L.filter(l=>!ST.lf||ST.lf==="all"||l.tags.includes(ST.lf));
 return `<h1 class="h">Leads <span>${t.id}</span></h1>${filt}
 <div class="leads">${show.map(l=>`<article class="lead">
   <div class="tags">${l.tags.map(g=>`<span class="tag ${g}">${TAGS[g][0]} ${TAGS[g][1]}</span>`).join("")}</div>
   <div class="duo">${pk(l.a,"md")}<span class="plus">+</span>${pk(l.b,"md")}</div>
   <div class="when"><b>Quando</b> ${esc(l.when)}</div>
   <div class="arrow">↓</div>
   <div class="gp"><b>Plano de jogo</b> ${esc(l.plan)}</div>
   ${l.back?`<div class="back"><b class="bh">Retaguarda: os outros 2</b>${l.back.map(k=>`<div class="brow">${pk(k,"sm")}<p>${esc((l.why||{})[k]||"")}</p></div>`).join("")}
   ${l.alt&&l.alt.length?`<div class="alts"><b class="bh">Trocar a retaguarda se…</b>${l.alt.map(x=>`<div class="arow">${tile(x.k,"sm")}<p><b>${esc(spec(x.k).n)}</b> ${esc(x.w)}</p></div>`).join("")}</div>`:""}
   ${l.ev?`<p class="ev">📎 ${esc(l.ev)}</p>`:""}</div>`:""}
 </article>`).join("")||`<p class="empty">Nenhum lead nesta categoria para o ${t.id}.</p>`}</div>${renderLegend()}${credit}`;}

 if(!t.matchups.length)return `<h1 class="h">Matchups <span>${t.id}</span></h1><p class="empty">${esc(t.noMatrix)}</p>${credit}`;
 return `<h1 class="h">Matchups <span>${t.id}</span></h1>
 <div class="mlist">${t.matchups.map((m,i)=>{const d=DIFF[m.diff];return `<details class="mu" ${i===ST.muOpen?"open":""} data-mu="${i}"><summary>
   <div class="mu-head"><div class="mu-opp">${m.opp.map(k=>tile(k,"sm",{role:false})).join("")}</div><div class="mu-t"><b>${esc(m.vs)}</b><span class="diff ${d[1]}">${d[0]}</span></div></div></summary>
   <div class="versus"><div class="side"><div class="lab">Meu lado</div><div class="duo">${pk(m.lead[0],"md")}<span class="plus">+</span>${pk(m.lead[1],"md")}</div></div>
   <div class="vs">VS</div>
   <div class="side"><div class="lab">Oponente</div><div class="opprow">${m.opp.map(k=>pk(k,"md","",{role:false})).join("")}</div></div></div>
   <div class="blk warn"><h4>⚠️ Principais ameaças</h4>${m.threats.map(x=>`<div class="row">${pk(x.p,"sm","",{role:false})}<p>${esc(x.w)}</p></div>`).join("")}</div>
   <div class="blk ok"><h4>🛡️ Respostas</h4>${m.answers.map(x=>`<div class="row">${pk(x.p,"sm")}<p>→ ${esc(x.w)}</p></div>`).join("")}</div>
   <div class="blk"><h4>Escolher 4</h4><div class="four">${m.four.map(k=>pk(k,"sm")).join("")}</div></div>
   ${m.rule?`<div class="rule">📌 ${esc(m.rule)}</div>`:""}
 </details>`}).join("")}</div>${credit}`;}

/* --- SPEED --- */
function vSpeed(){
 const own=[];TEAMS.forEach((t,ti)=>t.roster.forEach(r=>{if(ST.spdScope==="all"||ti===ST.team)own.push({k:r.k,n:SP[r.k].n,v:r.spe,team:t.id,ac:t.accent,own:1})}));
 const seen={};const ownU=own.filter(o=>{const id=o.k+o.v;if(seen[id]){seen[id].team+=" "+o.team;return false}seen[id]=o;return true});
 let rows=ownU.map(o=>Object.assign({},o,{v2:ST.spdMode==="tw"?o.v*2:o.v})).concat(BENCH.map(b=>({k:b.k,n:b.n,v:b.v,v2:b.v,own:0})));
 rows.sort((a,b)=>ST.spdMode==="tr"?a.v2-b.v2:b.v2-a.v2);
 const max=Math.min(260,Math.max(...rows.map(r=>r.v2)));
 return `<h1 class="h">Speed</h1>
 <div class="seg">${[["normal","Normal"],["tw","Nosso Tailwind ×2"],["tr","Trick Room (lento age antes)"]].map(([k,l])=>`<button data-sm="${k}" class="${ST.spdMode===k?"on":""}">${l}</button>`).join("")}</div>
 <div class="seg">${[["team","Só "+T().id],["all","Todos os times"]].map(([k,l])=>`<button data-ss="${k}" class="${ST.spdScope===k?"on":""}">${l}</button>`).join("")}</div>
 <ol class="spd">${rows.map(r=>`<li class="${r.own?"own":"bench"}">${tile(r.k,"sm",{role:!!r.own})}<div class="sp-n"><b>${esc(r.n)}</b>${r.own?`<span class="tm" style="--ac:${r.ac}">${r.team}</span>`:`<span class="bm">referência</span>`}</div>
   <div class="bar"><i style="width:${Math.min(100,Math.max(4,r.v2/max*100))}%"></i></div><b class="val">${r.v2}</b></li>`).join("")}</ol>
 <p class="muted">Tailwind dobra só as nossas peças. Sob Trick Room, a ordem inverte: quem está no topo age primeiro. Checar sempre se alguma peça deles é mais lenta que Farigiraf (80) antes de setar TR.</p>${credit}`;}

/* --- PARTIDAS --- */
function base(k){return OPP_RAW[k]?OPP_RAW[k][2]:(SP[k]?SP[k].n:k)}
function vGames(){
 if(ST.dbState==="loading")return `<h1 class="h">Partidas</h1><p class="empty">Carregando o histórico…</p>`;
 if(ST.dbState==="off")return `<h1 class="h">Partidas</h1><p class="empty">O histórico de partidas não está disponível nesta visualização. Abra o Atlas pelo claude.ai com sua conta para ver e registrar partidas.</p>`;
 const all=ST.games;const tid=T().id;
 const g=ST.pScope==="all"?all:all.filter(x=>x.time===tid);
 const W=g.filter(x=>x.resultado==="V").length,L=g.length-W;
 const byTeam=TEAMS.map(t=>{const a=all.filter(x=>x.time===t.id);const w=a.filter(x=>x.resultado==="V").length;return {t,n:a.length,w}});
 const opp={};g.forEach(x=>(x.opp||[]).forEach(k=>{const b=base(k);(opp[b]=opp[b]||{k,n:0,w:0,list:[]});opp[b].n++;if(x.resultado==="V")opp[b].w++;opp[b].list.push(x)}));
 const orows=Object.entries(opp).sort((a,b)=>b[1].n-a[1].n||a[0].localeCompare(b[0]));
 const pct=(w,n)=>n?Math.round(w/n*100):0;
 const gameRow=x=>`<li class="gm"><span class="res ${x.resultado==="V"?"v":"d"}">${x.resultado}</span><div><b>${esc(x.adversario)}</b> <span class="muted">${esc(x.time)} · ${esc(fmtD(x.data))}${x.jogo?` · G${x.jogo}`:""}${x.wo?" · W.O.":""}</span><div class="mini">${(x.opp||[]).map(k=>tile(k,"sm",{role:false})).join("")}</div>${x.nota?`<p class="muted">${esc(x.nota)}</p>`:""}</div></li>`;
 return `<h1 class="h">Partidas</h1>
 <div class="teamstats">${byTeam.map(({t,n,w})=>`<button class="ts ${t.id===tid?"on":""}" style="--ac:${t.accent}" data-team="${TEAMS.indexOf(t)}"><b>${t.id}</b><span>${n?`${w}V · ${n-w}D`:"sem jogos"}</span><i style="width:${pct(w,n)}%"></i></button>`).join("")}</div>
 <div class="seg">${[["team","Só "+tid],["all","Todos os times"]].map(([k,l])=>`<button data-ps="${k}" class="${ST.pScope===k?"on":""}">${l}</button>`).join("")}</div>
 <div class="big"><div><b>${W}</b><span>vitórias</span></div><div><b>${L}</b><span>derrotas</span></div><div><b>${pct(W,g.length)}%</b><span>de ${g.length} jogos</span></div></div>
 <p class="muted">Amostra pequena é evidência, não veredito.</p>
 <h2 class="h2">Contra cada Pokémon adversário</h2>
 ${orows.length?`<ul class="opps">${orows.map(([b,o])=>`<li class="orow ${ST.pOpen===b?"open":""}">${tile(o.k,"sm",{role:false})}<div class="o-n"><b>${esc(b)}</b><span>${o.w}V · ${o.n-o.w}D</span></div><div class="bar wl"><i style="width:${pct(o.w,o.n)}%"></i></div><b class="val">${pct(o.w,o.n)}%</b><button class="lnk" data-po="${esc(b)}" aria-expanded="${ST.pOpen===b}">${ST.pOpen===b?"Fechar":"Jogos"}</button>
   ${ST.pOpen===b?`<ul class="glist">${o.list.map(gameRow).join("")}</ul>`:""}</li>`).join("")}</ul>`:`<p class="empty">Nenhuma partida registrada ${ST.pScope==="all"?"":"para o "+tid}. Registre a primeira abaixo.</p>`}
 <h2 class="h2">Últimas partidas</h2><ul class="glist">${[...g].sort((a,b)=>(b.data||"").localeCompare(a.data||"")||(b.jogo||0)-(a.jogo||0)).slice(0,15).map(gameRow).join("")}</ul>
 ${formHTML()}${credit}`;}
function fmtD(d){if(!d)return"";const[y,m,dd]=d.split("-");return `${dd}/${m}`}
function formHTML(){if(ST.readOnly)return"";return `<details class="form"><summary>＋ Registrar partida</summary>
 <form id="gf" autocomplete="off"><label>Time<select name="time">${TEAMS.map(t=>`<option ${t.id===T().id?"selected":""}>${t.id}</option>`).join("")}</select></label>
 <label>Adversário (nick)<input name="adversario" required maxlength="40"></label>
 <label>Data<input type="date" name="data" value="${new Date().toISOString().slice(0,10)}"></label>
 <fieldset class="rs"><legend>Resultado</legend><label><input type="radio" name="resultado" value="V" required> Vitória</label><label><input type="radio" name="resultado" value="D"> Derrota</label><label><input type="checkbox" name="wo"> W.O.</label></fieldset>
 <label>Time adversário (até 6)<select name="opp" multiple size="6">${OPP_KEYS.map(k=>`<option value="${k}">${esc(OPP_RAW[k][0])}</option>`).join("")}</select></label>
 <label>Nota<input name="nota" maxlength="200"></label>
 <button class="save" type="submit">Salvar partida</button><p id="gmsg" class="muted" role="status"></p></form></details>`}

/* --- ORQUESTRAÇÃO --- */
const VIEWS={times:vTimes,leads:vLeads,matchups:vMatch,speed:vSpeed,partidas:vGames};
function render(){renderTeamBar();$("#view").innerHTML=VIEWS[ST.tab]();document.querySelectorAll("#tabs button").forEach(b=>{b.classList.toggle("on",b.dataset.tab===ST.tab);b.setAttribute("aria-current",b.dataset.tab===ST.tab?"page":"false")});saveUI()}
document.addEventListener("click",e=>{
 const b=e.target.closest("button");if(!b)return;
 if(b.dataset.team!=null){ST.team=+b.dataset.team;ST.pOpen=null;ST.muOpen=null;render();return}
 if(b.dataset.tab){ST.tab=b.dataset.tab;render();window.scrollTo(0,0);return}
 if(b.dataset.lf){ST.lf=b.dataset.lf;render();return}
 if(b.dataset.sm){ST.spdMode=b.dataset.sm;render();return}
 if(b.dataset.ss){ST.spdScope=b.dataset.ss;render();return}
 if(b.dataset.ps){ST.pScope=b.dataset.ps;ST.pOpen=null;render();return}
 if(b.dataset.po!=null){ST.pOpen=ST.pOpen===b.dataset.po?null:b.dataset.po;render();return}
});
document.addEventListener("toggle",e=>{const d=e.target;if(d.dataset&&d.dataset.mu!=null&&d.open)ST.muOpen=+d.dataset.mu},true);
document.addEventListener("submit",async e=>{if(e.target.id!=="gf")return;e.preventDefault();
 const f=e.target,fd=new FormData(f),msg=$("#gmsg");const opp=[...f.opp.selectedOptions].map(o=>o.value).slice(0,6);
 const doc={time:fd.get("time"),adversario:fd.get("adversario").trim(),data:fd.get("data"),resultado:fd.get("resultado"),wo:!!fd.get("wo"),opp,nota:(fd.get("nota")||"").trim(),jogo:0,origem:"atlas"};
 if(!ST.db){msg.textContent="Histórico indisponível nesta visualização.";return}
 msg.textContent="Salvando…";
 try{await ST.db.collection("partidas").add(doc);msg.textContent="Partida salva.";f.reset()}
 catch(err){msg.textContent=err&&err.code==="invalid_argument"?"Você não tem permissão para registrar partidas aqui.":"Não foi possível salvar agora. Tente de novo em instantes.";if(err&&err.code==="invalid_argument"){ST.readOnly=true}}
});
render();
(async()=>{
 let db=null;try{db=window.claude&&await window.claude.use("db")}catch(e){db=null}
 if(!db){ST.dbState="off";if(ST.tab==="partidas")render();return}
 ST.db=db;
 db.collection("partidas").onSnapshot(s=>{ST.games=s.docs.map(d=>Object.assign({id:d.id},d.data()));ST.dbState="ok";const a=document.activeElement;if(ST.tab==="partidas"&&!(a&&a.closest&&a.closest("#gf")))render()},
  err=>{ST.dbState="off";if(ST.tab==="partidas")render()});
})();

</script>
</body>
</html>
